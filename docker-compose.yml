services:
  au-news-digest:
    build:
      context: .
      dockerfile: Dockerfile
    image: au-news-digest:latest
    container_name: au-news-digest
    restart: unless-stopped
    ports:
      - "3800:3000"
    environment:
      - TZ=Australia/Sydney
      - DATABASE_PATH=/app/data/news.db
      - GEMINI_API_KEY=
      - GEMINI_MODEL=gemini-flash-lite-latest
      - ACCESS_PASSWORD=
      - MAX_ITEMS_PER_FEED=10
      - MAX_ITEMS_PER_GLOBAL_FEED=8
      - MAX_DB_SIZE_GB=10
      - CRON_SCHEDULE=0 */2 * * *
    volumes:
      - ./data:/app/data
